services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=change-this-to-a-very-secure-random-key-in-production
      - DATABASE_URL=postgresql://formcraft:secretpassword@postgres:5432/formcraft_db
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=admin123456
      - CORS_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_uploads:/app/server/uploads
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: formcraft
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: formcraft_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formcraft -d formcraft_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  app_uploads:
